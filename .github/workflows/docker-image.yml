name: Docker Image CI

on:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repository
        uses: actions/checkout@v6.0.3

      - name: Login Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login CNB Registry
        uses: docker/login-action@v4
        with:
          registry: docker.cnb.cool
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Jdk17
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-jdk17
          push: true
          tags: |
            jalena/java/jdk-alpine-cn:latest
            jalena/java/jdk-alpine-cn:17
            docker.cnb.cool/youvigo/base/java/jdk:17
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Jre17
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-jre17
          push: true
          tags: |
            jalena/java/jre/alpine-cn:latest
            jalena/java/jre/alpine-cn:17
            docker.cnb.cool/youvigo/base/java/jre:17
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Jdk21
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-jdk21
          push: true
          tags: |
            jalena/java/jdk/alpine-cn:21
            docker.cnb.cool/youvigo/base/java/jdk:21
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Jre21
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile-jre21
          push: true
          tags: |
            jalena/java/jre/alpine-cn:21
            docker.cnb.cool/youvigo/base/java/jre:21
          cache-from: type=gha
          cache-to: type=gha,mode=max
        
