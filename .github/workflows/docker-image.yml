name: Auto Build & Push JDK/JRE Alpine CN

on:
  schedule:
    # 每天检查一次（UTC 19:15，即北京时间 03:15，避开整点高峰）
    - cron: '15 19 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: '即使上游基础镜像未更新也强制重新构建全部版本'
        type: boolean
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  DOCKERHUB_NAMESPACE: jalena
  CNB_REGISTRY: docker.cnb.cool
  CNB_NAMESPACE: youvigo/base

jobs:
  check:
    name: Check Upstream Temurin Images
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      has_updates: ${{ steps.resolve.outputs.has_updates }}

    steps:
      - name: Resolve upstream digests & check registry
        id: resolve
        env:
          CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
          FORCE_BUILD: ${{ inputs.force }}
        run: |
          set -euo pipefail

          if ! command -v skopeo >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq skopeo
          fi

          TARGETS='[
            {"version":"17","type":"jdk","repo":"jdk-alpine-cn","is_latest":true},
            {"version":"21","type":"jdk","repo":"jdk-alpine-cn","is_latest":false},
            {"version":"17","type":"jre","repo":"jre-alpine-cn","is_latest":true},
            {"version":"21","type":"jre","repo":"jre-alpine-cn","is_latest":false}
          ]'

          BUILD_LIST="[]"
          for row in $(echo "${TARGETS}" | jq -c '.[]'); do
            VER=$(echo "$row" | jq -r '.version')
            TYPE=$(echo "$row" | jq -r '.type')
            REPO=$(echo "$row" | jq -r '.repo')
            IS_LATEST=$(echo "$row" | jq -r '.is_latest')

            UPSTREAM_REF="docker://docker.io/library/eclipse-temurin:${VER}-${TYPE}-alpine"
            UPSTREAM_DIGEST=$(skopeo inspect --override-os linux --override-arch amd64 "${UPSTREAM_REF}" | jq -r '.Digest')

            CNB_REF="docker://${CNB_REGISTRY}/${CNB_NAMESPACE}/${REPO}:${VER}"
            CURRENT_DIGEST=$(skopeo inspect --creds "cnb:${CNB_TOKEN}" "${CNB_REF}" 2>/dev/null | jq -r '.Labels["org.opencontainers.image.base.digest"] // ""' || true)

            echo "[${REPO}:${VER}] upstream=${UPSTREAM_DIGEST} current=${CURRENT_DIGEST:-none}"

            if [ "${FORCE_BUILD}" = "true" ] || [ "${UPSTREAM_DIGEST}" != "${CURRENT_DIGEST}" ]; then
              BUILD_LIST=$(echo "${BUILD_LIST}" | jq -c \
                --arg ver "$VER" \
                --arg type "$TYPE" \
                --arg repo "$REPO" \
                --argjson latest "$IS_LATEST" \
                --arg digest "$UPSTREAM_DIGEST" \
                '. + [{"version":$ver,"type":$type,"repo":$repo,"is_latest":$latest,"digest":$digest}]')
            fi
          done

          COUNT=$(echo "${BUILD_LIST}" | jq 'length')
          echo "matrix=${BUILD_LIST}" >> "$GITHUB_OUTPUT"
          if [ "${COUNT}" -gt 0 ]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build & Push (${{ matrix.repo }}:${{ matrix.version }})
    needs: check
    if: needs.check.outputs.has_updates == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login CNB Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CNB_REGISTRY }}
          username: cnb
          password: ${{ secrets.CNB_TOKEN }}

      - name: Generate image metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKERHUB_NAMESPACE }}/${{ matrix.repo }}
            ${{ env.CNB_REGISTRY }}/${{ env.CNB_NAMESPACE }}/${{ matrix.repo }}
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=latest,enable=${{ matrix.is_latest == true }}
          labels: |
            org.opencontainers.image.base.name=docker.io/library/eclipse-temurin:${{ matrix.version }}-${{ matrix.type }}-alpine
            org.opencontainers.image.base.digest=${{ matrix.digest }}

      - name: Build and push ${{ matrix.repo }}:${{ matrix.version }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            JAVA_VERSION=${{ matrix.version }}
            JAVA_TYPE=${{ matrix.type }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.repo }}-${{ matrix.version }}
          cache-to: type=gha,mode=max,scope=${{ matrix.repo }}-${{ matrix.version }}
